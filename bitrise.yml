format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

app:
  envs:
  - WORKDIR: "$BITRISE_DEPLOY_DIR/android"
  - MANIFEST_BRANCH: "12.1"
  - LUNCH_TARGET: "twrp_ziti-eng"
  - BUILD_TARGET: "vendorbootimage"

workflows:
  build_twrp:
    steps:
    # OPTIMIZATION: Pull down previous build blocks to skip redownloading common AOSP components
    - restore-cache:
        title: Restore Android Source Cache
        inputs:
        - keys: |
            android-src-{{ .Branch }}
            android-src-

    - script:
        title: Clean Build Environment & Install Dependencies
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              git-core gnupg flex bison build-essential zip curl zlib1g-dev \
              libssl-dev libncurses6 libncurses-dev python3 python3-pip \
              python-is-python3 lzop bc g++-multilib gcc-multilib rsync \
              unzip pkg-config lz4 u-boot-tools schedtool repo aria2 patch
            
            mkdir -p "$WORKDIR"
    
    - script:
        title: Sync OrangeFox Minimal Source Tree via Official Script
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            
            git config --global user.name "Bitrise Builder"
            git config --global user.email "builder@bitrise.io"
            
            # If the source tree was successfully loaded from the cache, skip the sync process
            if [ -d "$WORKDIR/.repo" ]; then
              echo "Existing repository framework framework verified from cache. Optimizing sync time..."
            fi
            
            mkdir -p "$BITRISE_DEPLOY_DIR/of_sync"
            cd "$BITRISE_DEPLOY_DIR/of_sync"
            
            git clone https://gitlab.com/OrangeFox/sync.git
            cd sync
            
            ./orangefox_sync.sh --branch "$MANIFEST_BRANCH" --path "$WORKDIR"
        timeout: 7200

    - script:
        title: Clone Target Device Trees & Sync Asset Components
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            cd "$WORKDIR"
            
            rm -rf device/oneplus/ziti
            mkdir -p device/oneplus 
            
            git clone --depth=1 https://github.com/djnakum6239/android_device_oneplus_ziti.git -b android15 device/oneplus/ziti
            
            cd bootable/recovery
            git config --global --add safe.directory "$WORKDIR/bootable/recovery"
            
            echo "OrangeFox target environment verified. Preparing build-tree mapping constants..."
            
    - script:
        title: Compile OrangeFox Recovery Image
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -x
            cd "$WORKDIR"
            
            export USE_CCACHE=1
            export CCACHE_DIR="$WORKDIR/.ccache"
            export ALLOW_MISSING_DEPENDENCIES=true
            
            export OF_MAINTAINER="not_dilip"
            export FOX_MAINTAINER_PATCH_VERSION="1"
            export FOX_BUILD_TYPE="beta-unofficial"
            export OF_LEGACY_SIDE_BUTTONS=1
            export OF_VANILLA_BUILD=0
            
            export OF_DYNAMIC_FULL_DECRYPTION=1
            export OF_PATCH_AVB20=1
            
            export FOX_BUILD_DEVICE="ziti"
            export FOX_REPLACE_TOOLBOX=1
            export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
            
            echo "Initializing build environment variables..."
            set +e
            . build/envsetup.sh
            lunch "$LUNCH_TARGET"
            set -e
            
            echo "Step 1: Pre-creating target output directory framework..."
            mkdir -p out/target/product/ziti
            
            echo "Step 2: Compiling host packing binaries and recovery components..."
            make -j$(nproc) \
              mkbootimg \
              recoveryimage
            
            echo "Step 3: Enforcing structural path copies for the repository DTB asset..."
            cp device/oneplus/ziti/prebuilt/dtb out/target/product/ziti/dtb.img
            cp device/oneplus/ziti/prebuilt/dtb out/target/product/ziti/dtb
            
            echo "Step 4: Packaging the final OrangeFox vendor_boot image container..."
            out/host/linux-x86/bin/mkbootimg \
              --dtb out/target/product/ziti/dtb.img \
              --vendor_cmdline "buildvariant=eng" \
              --header_version 4 \
              --vendor_ramdisk out/target/product/ziti/ramdisk-recovery.cpio.gz \
              --ramdisk_type RECOVERY \
              --ramdisk_name recovery \
              --vendor_ramdisk_fragment out/target/product/ziti/ramdisk-recovery.cpio.gz \
              --vendor_boot out/target/product/ziti/OrangeFox-vendor_boot.img
            
            echo "Step 5: Appending AVB crypto verified boot hash footers..."
            out/host/linux-x86/bin/avbtool add_hash_footer \
              --image out/target/product/ziti/OrangeFox-vendor_boot.img \
              --partition_size 100663296 \
              --partition_name vendor_boot \
              --prop com.android.build.vendor_boot.fingerprint:oneplus/ziti/ziti:12/SKQ1.221115.001/release-keys
            
            echo "SUCCESS: OrangeFox vendor_boot.img generated perfectly!"

    - script:
        title: Export Image Outputs
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            TARGET_FILE="$WORKDIR/out/target/product/ziti/OrangeFox-vendor_boot.img"
            if [ -f "$TARGET_FILE" ]; then
              echo "Exporting compiled artifact to Bitrise Deploy storage directory..."
              cp "$TARGET_FILE" "$BITRISE_DEPLOY_DIR/"
            else
              echo "ERROR: Target output recovery file not found!"
              exit 1
            fi

    # OPTIMIZATION: Compress and store structural layout components for your next runner run
    - save-cache:
        title: Save Android Source Cache
        inputs:
        - key: android-src-{{ .Branch }}
        - paths: |
            /bitrise/deploy/android/.repo
            /bitrise/deploy/android/.ccache

