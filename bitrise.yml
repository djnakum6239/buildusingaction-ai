format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

app:
  envs:
  - WORKDIR: "$BITRISE_DEPLOY_DIR/android"
  - MANIFEST_URL: "https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git"
  - MANIFEST_BRANCH: "twrp-12.1"
  - LUNCH_TARGET: "twrp_ziti-eng"
  - BUILD_TARGET: "recoveryimage"
  
workflows:
  build_twrp:
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    
    - script@1:
        title: Clean Build Environment & Install Dependencies
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            
            # Install Ubuntu 24.04 compatible tools (using libncurses6 and dev headers)
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              git-core gnupg flex bison build-essential zip curl zlib1g-dev \
              libssl-dev libncurses6 libncurses-dev python3 python3-pip \
              python-is-python3 lzop bc g++-multilib gcc-multilib rsync \
              unzip pkg-config lz4 u-boot-tools schedtool repo
            
            mkdir -p "$WORKDIR"
    
    - script@1:
        title: Repo Init and Sync AOSP Minimal Source Tree
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            cd "$WORKDIR"
            
            git config --global user.name "Bitrise Builder"
            git config --global user.email "builder@bitrise.io"
            
            # Shallow framework initialization
            repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" --depth=1
            repo sync -c -j$(nproc) --no-tags --no-clone-bundle --force-sync
        timeout: 7200

    - script@1:
        title: Clone Target Device Trees (Post-Sync)
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            cd "$WORKDIR"
            
            # Wipe local targets to prevent overlapping paths
            rm -rf device/oneplus/ziti vendor/oneplus/ziti kernel/oneplus/sm7325
            mkdir -p device/oneplus vendor/oneplus kernel/oneplus
            
            # 1. Clone your verified device tree into the exact destination folder
            git clone --depth=1 https://github.com/amit-0i/twrp_device_oneplus_ziti.git device/oneplus/ziti
            
            # 2. Clone the verified official open-source OnePlus kernel tree into the destination folder
            git clone --depth=1 https://github.com/OnePlusOSS/android_kernel_oneplus_sm7325.git kernel/oneplus/sm7325
            
            # 3. Handle Vendor: Since OnePlusOSS doesn't host an official vendor tree, 
            # we create an empty placeholder directory. Most modern TWRP trees bypass proprietary vendor 
            # files during recovery compilation by copying required blobs from the device dynamically.
            mkdir -p vendor/oneplus/ziti

    - script@1:
        title: Compile TWRP Image
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            cd "$WORKDIR"
            
            export USE_CCACHE=0
            # Tells AOSP build engine to ignore missing proprietary vendor files
            export ALLOW_MISSING_DEPENDENCIES=true
            
            . build/envsetup.sh
            lunch "$LUNCH_TARGET"
            
            make -j$(nproc) "$BUILD_TARGET"

    - deploy-to-bitrise-io@2:
        title: Export Image Outputs
        inputs:
        - deploy_path: "$WORKDIR/out/target/product/ziti"
        - notify_email_list: ""
        
