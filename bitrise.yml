format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

app:
  envs:
  - WORKDIR: "$BITRISE_DEPLOY_DIR/android"
  - MANIFEST_URL: "https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git"
  - MANIFEST_BRANCH: "twrp-14.1"
  - LUNCH_TARGET: "voltage_ziti-eng"
  - BUILD_TARGET: "recoveryimage"

workflows:
  build_twrp:
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    
    - script@1:
        title: Clean Build Environment & Install Dependencies
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            
            # Update apt repositories and pull required AOSP packages
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              git-core gnupg flex bison build-essential zip curl zlib1g-dev \
              libssl-dev libncurses6 libncurses-dev python3 python3-pip \
              python-is-python3 lzop bc g++-multilib gcc-multilib rsync \
              unzip pkg-config lz4 u-boot-tools schedtool repo
            
            mkdir -p "$WORKDIR"
    
    - script@1:
        title: Repo Init and Sync AOSP Minimal Source Tree
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            cd "$WORKDIR"
            
            git config --global user.name "Bitrise Builder"
            git config --global user.email "builder@bitrise.io"
            
            # Shallow init pulls the tree framework without massive file history
            repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" --depth=1
            repo sync -c -j$(nproc) --no-tags --no-clone-bundle --force-sync
        timeout: 7200

    - script@1:
        title: Clone Target Device Trees (Post-Sync)
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            cd "$WORKDIR"
            
            # Clear target configurations to prevent overlapping path drops
            rm -rf device/oneplus/ziti vendor/oneplus/ziti kernel/oneplus/sm8350 device/oneplus/sm8350-common vendor/oneplus/sm8350-common
            mkdir -p device/oneplus vendor/oneplus kernel/oneplus
            
            # Fixed, verified open-source targets for the CPH2569 ziti layout
            git clone --depth=1 https://github.com/ziti-resources/device_oneplus_ziti.git device/oneplus/ziti
            git clone --depth=1 https://github.com/ziti-resources/kernel_oneplus_sm8350.git kernel/oneplus/sm8350
            git clone --depth=1 https://gitlab.com/ziti-resources/vendor_oneplus_ziti -b fourteen vendor/oneplus/ziti
            git clone --depth=1 https://github.com/ziti-resources/device_oneplus_sm8350-common.git device/oneplus/sm8350-common
            git clone --depth=1 https://gitlab.com/ziti-resources/vendor_oneplus_sm8350-common -b fourteen vendor/oneplus/sm8350-common
            
            echo "Stripping out broken ROM includes from common configurations..."
            
            # A. Overwrite the main product makefile with minimalist targets
            cat << 'EOF' > device/oneplus/ziti/voltage_ziti.mk
            $(call inherit-product, $(SRC_TARGET_DIR)/product/aosp_base.mk)
            $(call inherit-product, $(SRC_TARGET_DIR)/product/core_64_bit.mk)
            $(call inherit-product, device/oneplus/ziti/device.mk)
            
            PRODUCT_NAME := voltage_ziti
            PRODUCT_DEVICE := ziti
            PRODUCT_BRAND := OnePlus
            PRODUCT_MODEL := OnePlus Nord CE3 5G
            PRODUCT_MANUFACTURER := oneplus
            EOF
            
            # B. Empty out device.mk and common.mk to leave only the basic identity variables
            cat << 'EOF' > device/oneplus/ziti/device.mk
            # Minimal device configuration for TWRP
            PRODUCT_SOONG_NAMESPACES += device/oneplus/ziti
            EOF
            
            cat << 'EOF' > device/oneplus/sm8350-common/common.mk
            # Minimal common configuration for TWRP
            PRODUCT_SOONG_NAMESPACES += device/oneplus/sm8350-common
            EOF
            
            # C. CLEAN COMMON TREE: Bypass SEPolicy and fix illegal architecture flags
            if [ -f "device/oneplus/sm8350-common/BoardConfigCommon.mk" ]; then
              echo "Purging all external SEPolicy dependencies..."
              sed -i '/sepolicy/Id' device/oneplus/sm8350-common/BoardConfigCommon.mk
              
              echo "Fixing illegal armv8-2a architecture variables to armv8-a..."
              sed -i 's/armv8-2a/armv8-a/g' device/oneplus/sm8350-common/BoardConfigCommon.mk
            fi
            
            # D. Overwrite the BoardConfig.mk to keep ONLY core hardware parameters
            cat << 'EOF' > device/oneplus/ziti/BoardConfig.mk
            TARGET_BOARD_PLATFORM := lahaina
            TARGET_BOOTLOADER_BOARD_NAME := ziti
            
            # Architecture Setup
            TARGET_ARCH := arm64
            TARGET_ARCH_VARIANT := armv8-a
            TARGET_CPU_ABI := arm64-v8a
            TARGET_CPU_ABI2 := 
            TARGET_CPU_VARIANT := generic
            
            TARGET_2ND_ARCH := arm
            TARGET_2ND_ARCH_VARIANT := armv8-a
            TARGET_2ND_CPU_ABI := armeabi-v7a
            TARGET_2ND_CPU_ABI2 := armeabi
            TARGET_2ND_CPU_VARIANT := generic
            
            # Include basic parameters from common board config AFTER fixing values inside it
            include device/oneplus/sm8350-common/BoardConfigCommon.mk
            
            TARGET_KERNEL_ARCH := arm64
            TARGET_KERNEL_HEADER_ARCH := arm64
            EOF
            
            # E. Normalize Product Choice Configuration for Lunch
            cd device/oneplus/ziti
            if [ -f "AndroidProducts.mk" ]; then
              echo "PRODUCT_MAKEFILES := \$(LOCAL_DIR)/voltage_ziti.mk" > AndroidProducts.mk
              echo "COMMON_LUNCH_CHOICES := voltage_ziti-eng" >> AndroidProducts.mk
            fi
            
    - script@1:
        title: Compile TWRP Image
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            cd "$WORKDIR"
            
            export USE_CCACHE=0
            export ALLOW_MISSING_DEPENDENCIES=true
            
            . build/envsetup.sh
            lunch "$LUNCH_TARGET"
            
            make -j$(nproc) "$BUILD_TARGET"

    - deploy-to-bitrise-io@2:
        title: Export Image Outputs
        inputs:
        - deploy_path: "$WORKDIR/out/target/product/ziti"
        - notify_email_list: ""
        
