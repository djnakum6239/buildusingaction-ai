format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

app:
  envs:
  - WORKDIR: "$BITRISE_DEPLOY_DIR/android"
  # Standardized official OrangeFox recovery manifest parameters
  - MANIFEST_URL: "https://gitlab.com/OrangeFox/Manifest.git"
  - MANIFEST_BRANCH: "fox_12.1"
  - LUNCH_TARGET: "twrp_ziti-eng"
  - BUILD_TARGET: "vendorbootimage"

workflows:
  build_twrp: # FIXED: Changed from build_orangefox to prevent Bitrise configuration matching failures
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    
    - script@1:
        title: Clean Build Environment & Install Dependencies
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              git-core gnupg flex bison build-essential zip curl zlib1g-dev \
              libssl-dev libncurses6 libncurses-dev python3 python3-pip \
              python-is-python3 lzop bc g++-multilib gcc-multilib rsync \
              unzip pkg-config lz4 u-boot-tools schedtool repo aria2
            
            mkdir -p "$WORKDIR"
    
    - script@1:
        title: Repo Init and Sync OrangeFox Minimal Source Tree
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            cd "$WORKDIR"
            
            git config --global user.name "Bitrise Builder"
            git config --global user.email "builder@bitrise.io"
            
            # Pull down the baseline build tree framework configuration
            repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" --depth=1
            repo sync -c -j$(nproc) --no-tags --no-clone-bundle --force-sync
        timeout: 7200

    - script@1:
        title: Clone Target Device Trees & Sync OrangeFox Sync Script
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            cd "$WORKDIR"
            
            rm -rf device/oneplus/ziti
            mkdir -p device/oneplus 
            
            # Setup device trees targeting Android 15 configurations
            git clone --depth=1 https://github.com/djnakum6239/android_device_oneplus_ziti.git -b android15 device/oneplus/ziti
            
            # FIXED: Aligned branches to 'fox_12.1' to match core manifest tree specifications
            cd bootable/recovery
            git clone https://gitlab.com/OrangeFox/sync.git orangefox_sync
            ./orangefox_sync/get_fox.sh --branch fox_12.1 --device ziti

    - script@1:
        title: Compile OrangeFox Recovery Image
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            cd "$WORKDIR"
            
            export USE_CCACHE=0
            export ALLOW_MISSING_DEPENDENCIES=true
            
            # Unified configuration variables for clean cross-SDK (A13-A16) execution 
            export FOX_VERSION="R12.1"
            export OF_MAINTAINER="BitriseBuilder"
            export FOX_BUILD_TYPE="Unofficial"
            export OF_LEGACY_SIDE_BUTTONS=1
            export OF_VANILLA_BUILD=0
            
            # Force inline decryption overrides across virtual file storage systems
            export OF_DYNAMIC_FULL_DECRYPTION=1
            export OF_PATCH_AVB20=1
            
            . build/envsetup.sh
            lunch "$LUNCH_TARGET"
            
            echo "Step 1: Pre-creating target output directory framework..."
            mkdir -p out/target/product/ziti
            
            echo "Step 2: Building mkbootimg host tools & intermediate cpio archives..."
            make -j$(nproc) \
              mkbootimg \
              out/target/product/ziti/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.cpio.gz \
              out/target/product/ziti/obj/PACKAGING/vendor_boot_intermediates/vendor_ramdisk.cpio.gz || true
            
            echo "Step 3: Enforcing structural path copies for the repository DTB asset..."
            cp device/oneplus/ziti/prebuilt/dtb out/target/product/ziti/dtb.img
            cp device/oneplus/ziti/prebuilt/dtb out/target/product/ziti/dtb
            
            echo "Step 4: Packaging the final OrangeFox vendor_boot image container..."
            out/host/linux-x86/bin/mkbootimg \
              --dtb out/target/product/ziti/dtb.img \
              --vendor_cmdline "buildvariant=eng" \
              --header_version 4 \
              --vendor_ramdisk out/target/product/ziti/obj/PACKAGING/vendor_boot_intermediates/vendor_ramdisk.cpio.gz \
              --ramdisk_type RECOVERY \
              --ramdisk_name recovery \
              --vendor_ramdisk_fragment out/target/product/ziti/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.cpio.gz \
              --vendor_boot out/target/product/ziti/OrangeFox-vendor_boot.img
            
            echo "Step 5: Appending AVB crypto verified boot hash footers..."
            out/host/linux-x86/bin/avbtool add_hash_footer \
              --image out/target/product/ziti/OrangeFox-vendor_boot.img \
              --partition_size 100663296 \
              --partition_name vendor_boot \
              --prop com.android.build.vendor_boot.fingerprint:oneplus/ziti/ziti:12/SKQ1.221115.001/release-keys
            
            echo "SUCCESS: OrangeFox vendor_boot.img generated perfectly!"
            
    - deploy-to-bitrise-io@2:
        title: Export Image Outputs
        inputs:
        - deploy_path: "$WORKDIR/out/target/product/ziti/OrangeFox-vendor_boot.img"
        - notify_email_list: "d.j.nakum6239@gmail.com"
        
