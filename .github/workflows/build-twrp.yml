name: Build TWRP Recovery (Ubuntu 22.04)

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: 'repo manifest URL (manifest.xml)'
        required: true
        default: 'https://github.com/TeamWin/android_manifest.git'
      manifest_branch:
        description: 'manifest branch (e.g., twrp-12.1 or twrp-11)'
        required: true
        default: 'twrp-12.1'
      lunch_target:
        description: 'lunch target (e.g., twrp_oneplus_ziti-eng)'
        required: true
        default: 'twrp_oneplus_ziti-eng'
      build_target:
        description: 'build target (recoveryimage or bootimage as needed)'
        required: true
        default: 'recoveryimage'
      clone_device:
        description: 'Clone device/kernel/vendor repos (true/false)'
        required: true
        default: 'true'
      device_repo:
        description: 'Optional device repo to clone (git URL)'
        required: false
        default: 'https://github.com/amit-0i/twrp_device_oneplus_ziti.git'
      kernel_repo:
        description: 'Optional kernel repo to clone (git URL)'
        required: false
        default: 'https://github.com/OnePlusOSS/android_kernel_oneplus_sm7325.git'
      vendor_repo:
        description: 'Optional vendor repo to clone (git URL)'
        required: false
        default: 'https://github.com/OnePlusOSS/android_vendor_oneplus_ziti.git'
      jobs:
        description: 'Parallel jobs for make (use 2,4,8,... or leave blank for runner cores)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      WORKDIR: ${{ github.workspace }}/android
      CCACHE_DIR: ${{ runner.temp }}/ccache
      MANIFEST_URL: ${{ github.event.inputs.manifest_url }}
      MANIFEST_BRANCH: ${{ github.event.inputs.manifest_branch }}
      LUNCH_TARGET: ${{ github.event.inputs.lunch_target }}
      BUILD_TARGET: ${{ github.event.inputs.build_target }}
      DEVICE_REPO: ${{ github.event.inputs.device_repo }}
      KERNEL_REPO: ${{ github.event.inputs.kernel_repo }}
      VENDOR_REPO: ${{ github.event.inputs.vendor_repo }}
      JOBS: ${{ github.event.inputs.jobs }}
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java (OpenJDK 11)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libssl-dev libncurses5 libncurses5-dev python3 python3-pip \
            python-is-python3 lzop bc g++-multilib gcc-multilib rsync \
            unzip pkg-config ccache lz4 u-boot-tools schedtool \
            android-sdk-libsdl2 || true
          # Clean apt cache
          sudo apt-get clean
        shell: bash

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "Added ~/bin to PATH"
          echo 'export PATH=$HOME/bin:$PATH' >> $GITHUB_ENV
        shell: bash

      - name: Prepare workspace
        run: |
          mkdir -p "${WORKDIR}"
          mkdir -p "${CCACHE_DIR}"
        shell: bash

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-twrp-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-twrp-
      - name: Configure ccache
        run: |
          ccache -M 30G || true
          echo "CCACHE_DIR=${CCACHE_DIR}" >> $GITHUB_ENV
          echo "USE_CCACHE=1" >> $GITHUB_ENV
        shell: bash

      - name: Optional:Clone device/kernel/vendor repos
        if: ${{ github.event.inputs.clone_device == 'true' }}
        run: |
          set -e
          cd "${WORKDIR}"
          mkdir -p device vendor kernel
          if [ -n "${DEVICE_REPO}" ]; then
            git clone --depth=1 "${DEVICE_REPO}" device/oneplus/ziti || true
          fi
          if [ -n "${KERNEL_REPO}" ]; then
            git clone --depth=1 "${KERNEL_REPO}" kernel/oneplus/sm7325 || true
          fi
          if [ -n "${VENDOR_REPO}" ]; then
            git clone --depth=1 "${VENDOR_REPO}" vendor/oneplus || true
          fi
        shell: bash

      - name: Repo init (manifest)
        run: |
          set -e
          cd "${WORKDIR}"
          repo init -u "${MANIFEST_URL}" -b "${MANIFEST_BRANCH}" --depth=1 || repo init -u "${MANIFEST_URL}" -b "${MANIFEST_BRANCH}"
        shell: bash

      - name: Repo sync (fetch sources)
        run: |
          set -e
          cd "${WORKDIR}"
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle || repo sync -c -j2 --no-tags
        shell: bash
        timeout-minutes: 180

      - name: Apply extra local patches (optional)
        run: |
          # Place any ad-hoc patching/overrides here, e.g. copy device tree from repo root into repo tree
          # Example: if you cloned device tree earlier into repo root, copy into Android tree
          if [ -d "$GITHUB_WORKSPACE/android/device/oneplus/ziti" ]; then
            cp -r $GITHUB_WORKSPACE/android/device/oneplus/ziti ${WORKDIR}/device/oneplus/ziti || true
          fi
        shell: bash

      - name: Build TWRP recovery
        run: |
          set -e
          cd "${WORKDIR}"
          # load environment and lunch
          export USE_CCACHE=1
          export CCACHE_DIR="${CCACHE_DIR}"
          # ensure repo's build/envsetup exists
          . build/envsetup.sh
          lunch "${LUNCH_TARGET}"
          # choose number of jobs
          if [ -n "${JOBS}" ]; then
            JOBS_ARG="-j${JOBS}"
          else
            JOBS_ARG="-j$(nproc)"
          fi
          # prefer mka if available
          if command -v mka >/dev/null 2>&1; then
            mka ${BUILD_TARGET} ${JOBS_ARG}
          else
            make ${BUILD_TARGET} ${JOBS_ARG}
          fi
        shell: bash
        timeout-minutes: 120

      - name: Find and upload recovery artifact
        run: |
          set -e
          cd "${WORKDIR}"
          # Common output paths
          ARTIFACTS=()
          while IFS= read -r -d $'\0' file; do
            ARTIFACTS+=("$file")
          done < <(find out -type f -iname "recovery*.img" -print0 || true)
          if [ ${#ARTIFACTS[@]} -eq 0 ]; then
            echo "No recovery image found in out/ - list out/ for debugging"
            ls -la out || true
            exit 0
          fi
          echo "Found artifacts:"
          for f in "${ARTIFACTS[@]}"; do echo "$f"; done
        shell: bash

      - name: Upload recovery artifact(s)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-recovery
          path: |
            ${WORKDIR}/out/**/recovery*.img
            ${WORKDIR}/out/**/boot*.img

      - name: Print summary
        run: |
          echo "Build job finished. If artifacts were produced they are uploaded as 'twrp-recovery'."
        shell: bash
