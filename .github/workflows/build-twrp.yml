name: Build TWRP Recovery (Ubuntu 22.04)

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: 'repo manifest URL (manifest.xml)'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git'
      manifest_branch:
        description: 'manifest branch (e.g., twrp-12.1 or twrp-14)'
        required: true
        default: 'twrp-14.1'
      lunch_target:
        description: 'lunch target (e.g., twrp_oneplus_ziti-eng)'
        required: true
        default: 'twrp_oneplus_ziti-eng'
      build_target:
        description: 'build target (recoveryimage or bootimage as needed)'
        required: true
        default: 'recoveryimage'
      clone_device:
        description: 'Clone device/kernel/vendor repos (true/false)'
        required: true
        default: 'true'
      device_repo:
        description: 'Optional device repo to clone (git URL)'
        required: false
        default: 'https://github.com/amit-0i/twrp_device_oneplus_ziti.git'
      kernel_repo:
        description: 'Optional kernel repo to clone (git URL)'
        required: false
        default: 'https://github.com/OnePlusOSS/android_kernel_oneplus_sm7325.git'
      vendor_repo:
        description: 'Optional vendor repo to clone (git URL)'
        required: false
        default: 'https://github.com/OnePlusOSS/android_vendor_oneplus_ziti.git'
      make_jobs:
        description: 'Parallel jobs for make (leave blank for runner cores)'
        required: false
        default: ''
      
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      WORKDIR: ${{ github.workspace }}/android

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Maximize Runner Disk Space
        run: |
          echo "=== Disk space BEFORE cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf /etc/apt/sources.list.d/* /var/lib/apt/lists/*
          docker rmi $(docker images -q) || true
          sudo apt-get clean
          echo "=== Disk space AFTER cleanup ==="
          df -h

      - name: Set up Java (OpenJDK 11)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
# Cleanup The Actions Workspace Using Custom Composite Run Actions
      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main
# That's it! Now normal steps

          
      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libssl-dev libncurses5 libncurses5-dev python3 python3-pip \
            python-is-python3 lzop bc g++-multilib gcc-multilib rsync \
            unzip pkg-config lz4 u-boot-tools schedtool || true
        shell: bash

      - name: Install repo tool natively
        run: |
          sudo apt-get update
          sudo apt-get install -y repo
          # Verify it is installed and map it to GITHUB_ENV path safely
          which repo
          echo "PATH=$(dirname $(which repo)):$PATH" >> $GITHUB_ENV
        shell: bash
        
      - name: Prepare workspace
        run: mkdir -p "${WORKDIR}"

      - name: Repo init (manifest)
        env:
          MANIFEST_URL: ${{ github.event.inputs.manifest_url }}
          MANIFEST_BRANCH: ${{ github.event.inputs.manifest_branch }}
        run: |
          cd "${WORKDIR}"
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" --depth=1
        shell: bash

      - name: Repo sync (Shallow & Force Clean)
        run: |
          cd "${WORKDIR}"
          # Stripping extra tags and bundle clones saves massive storage overhead
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle --force-sync
        shell: bash
        timeout-minutes: 120

      - name: Clone device trees (Post-Sync)
        if: ${{ github.event.inputs.clone_device == 'true' }}
        env:
          DEVICE_REPO: ${{ github.event.inputs.device_repo }}
          KERNEL_REPO: ${{ github.event.inputs.kernel_repo }}
          VENDOR_REPO: ${{ github.event.inputs.vendor_repo }}
        run: |
          cd "${WORKDIR}"
          rm -rf device/oneplus/ziti vendor/oneplus/ziti kernel/oneplus/sm7325
          mkdir -p device/oneplus vendor/oneplus kernel/oneplus
          
          if [ -n "$DEVICE_REPO" ]; then git clone --depth=1 "$DEVICE_REPO" device/oneplus/ziti; fi
          if [ -n "$KERNEL_REPO" ]; then git clone --depth=1 "$KERNEL_REPO" kernel/oneplus/sm7325; fi
          if [ -n "$VENDOR_REPO" ]; then git clone --depth=1 "$VENDOR_REPO" vendor/oneplus/ziti; fi
        shell: bash
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12
        
      - name: Build TWRP recovery
        env:
          LUNCH_TARGET: ${{ github.event.inputs.lunch_target }}
          BUILD_TARGET: ${{ github.event.inputs.build_target }}
        run: |
          cd "${WORKDIR}"
          # Explicitly disabling ccache to preserve physical storage blocks
          export USE_CCACHE=0
          
          . build/envsetup.sh
          lunch "$LUNCH_TARGET"
          
          # Force the compiler to clean up intermediary targets aggressively if possible
          make -j$(nproc) "$BUILD_TARGET"
        shell: bash

      - name: Upload Recovery Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Recovery-CPH2569
          path: |
            ${{ env.WORKDIR }}/out/target/product/ziti/*.img
            ${{ env.WORKDIR }}/out/target/product/ziti/*.zip
          if-no-files-found: error
          

