name: Build TWRP Recovery (Ubuntu 22.04)

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: 'Repo manifest URL (manifest.xml)'
        required: true
        default: 'https://github.com/TeamWin/android_manifest.git'
      manifest_branch:
        description: 'Manifest branch (e.g., twrp-12.1)'
        required: true
        default: 'twrp-12.1'
      lunch_target:
        description: 'Lunch target (e.g., twrp_oneplus_ziti-eng)'
        required: true
        default: 'twrp_oneplus_ziti-eng'
      build_target:
        description: 'Build target (recoveryimage or bootimage)'
        required: true
        default: 'recoveryimage'
      clone_device:
        description: 'Clone device/kernel/vendor repos (true/false)'
        required: true
        default: 'true'
      device_repo:
        description: 'Device repo HTTPS URL'
        required: false
        default: 'https://github.com/amit-0i/twrp_device_oneplus_ziti.git'
      kernel_repo:
        description: 'Kernel repo HTTPS URL'
        required: false
        default: 'https://github.com/OnePlusOSS/android_kernel_oneplus_sm7325.git'
      vendor_repo:
        description: 'Vendor repo HTTPS URL'
        required: false
        default: 'https://github.com/OnePlusOSS/android_vendor_oneplus_ziti.git'
      make_jobs:
        description: 'Parallel jobs for make (e.g., 8). Leave empty to use runner cores.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java (OpenJDK 11)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libssl-dev libncurses5 libncurses5-dev python3 python3-pip \
            python-is-python3 lzop bc g++-multilib gcc-multilib rsync \
            unzip pkg-config ccache lz4 u-boot-tools schedtool || true
          sudo apt-get clean
        shell: bash

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -sS https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "PATH=$HOME/bin:$PATH" >> $GITHUB_ENV
        shell: bash

      - name: Prepare workspace + set WORKDIR/CCACHE_DIR
        run: |
          WORKDIR="$GITHUB_WORKSPACE/android"
          CCACHE_DIR="$RUNNER_TEMP/ccache"
          mkdir -p "$WORKDIR" "$CCACHE_DIR"
          echo "WORKDIR=$WORKDIR" >> $GITHUB_ENV
          echo "CCACHE_DIR=$CCACHE_DIR" >> $GITHUB_ENV
        shell: bash

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ runner.os }}-twrp-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-twrp-

      - name: Configure ccache
        run: |
          ccache -M 30G || true
          echo "USE_CCACHE=1" >> $GITHUB_ENV
        shell: bash

      - name: Optional: Clone device/kernel/vendor repos
        if: ${{ github.event.inputs.clone_device == 'true' }}
        run: |
          set -e
          cd "$WORKDIR"
          mkdir -p device/oneplus vendor/oneplus kernel/oneplus
          if [ -n "${{ github.device_repo }}" ]; then
            git clone --depth=1 "${{ github.event.inputs.device_repo }}" device/oneplus/ziti || true
          fi
          if [ -n "${{ github.event.inputs.kernel_repo }}" ]; then
            git clone --depth=1 "${{ github.event.inputs.kernel_repo }}" kernel/oneplus/sm7325 || true
          fi
          if [ -n "${{ github.event.inputs.vendor_repo }}" ]; then
            git clone --depth=1 "${{ github.event.inputs.vendor_repo }}" vendor/oneplus || true
          fi
        shell: bash

      - name: Repo init (manifest)
        run: |
          set -e
          cd "$WORKDIR"
          repo init -u "${{ github.event.inputs.manifest_url }}" -b "${{ github.event.inputs.manifest_branch }}" --depth=1 || repo init -u "${{ github.event.inputs.manifest_url }}" -b "${{ github.event.inputs.manifest_branch }}"
        shell: bash

      - name: Repo sync (fetch sources)
        run: |
          set -e
          cd "$WORKDIR"
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle || repo sync -c -j2 --no-tags
        shell: bash
        timeout-minutes: 180

      - name: Apply extra local patches (optional)
        run: |
          # If you keep a device tree inside the workflow repo, copy into Android tree
          if [ -d "$GITHUB_WORKSPACE/device/oneplus/ziti" ]; then
            cp -r "$GITHUB_WORKSPACE/device/oneplus/ziti" "$WORKDIR/device/oneplus/ziti" || true
          fi
        shell: bash

      - name: Build TWRP recovery
        run: |
          set -e
          cd "$WORKDIR"
          export USE_CCACHE=1
          export CCACHE_DIR="$CCACHE_DIR"
          . build/envsetup.sh
          lunch "${{ github.event.inputs.lunch_target }}"
          if [ -n "${{ github.event.inputs.make_jobs }}" ]; then
            JOBS_ARG="-j${{ github.event.inputs.make_jobs }}"
          else
            JOBS_ARG="-j$(nproc)"
          fi
          if command -v mka >/dev/null 2>&1; then
            mka ${{ github.event.inputs.build_target }} ${JOBS_ARG}
          else
            make ${{ github.event.inputs.build_target }} ${JOBS_ARG}
          fi
        shell: bash
        timeout-minutes: 120

      - name: Find and list recovery artifact
        run: |
          set -e
          cd "$WORKDIR"
          find out -type f -iname "recovery*.img" -print || true
          find out -type f -iname "boot*.img" -print || true
        shell: bash

      - name: Upload recovery artifact(s)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-recovery
          path: |
            $GITHUB_WORKSPACE/android/out/**/recovery*.img
            $GITHUB_WORKSPACE/android/out/**/boot*.img

      - name: Print summary
        run: |
          echo "Build job finished. Artifacts (if produced) are uploaded as 'twrp-recovery'."
        shell: bash
